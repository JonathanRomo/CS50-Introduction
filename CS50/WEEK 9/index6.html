{% extends "layout.html" %}

{% block body %}
# changes get to post to the server instead of get
# get is good for the default, but post is better for sending data to the server
    <form action="/greet" method="post">
        <input autocomplete="off" autofocus type="text" name="name" placeholder="Enter your name">
        <button type="submit">Greet</button>
    </form>
{% endblock %}
